<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk | Banyuwangi Furniture</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --wood-dark: #1f1a16;
      --wood: #7a4f2b;
      --cream: #f7f1e8;
      --gold: #d8b887;
      --shadow: 0 24px 70px rgba(31,26,22,0.16);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: #1f1a16;
    }

    .container {
      width: min(1180px, calc(100% - 40px));
      margin: auto;
    }

    .navbar {
      background: rgba(31,26,22,0.92);
      padding: 18px 0;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .nav-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: white;
      text-decoration: none;
    }

    .logo-box {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: hidden;
      background: white;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }

    .brand h1 {
      font-size: 18px;
    }

    .brand span {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.2em;
    }

    .hero {
      padding: 120px 0 60px;
      text-align: center;
    }

    .hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 58px;
      margin-bottom: 16px;
    }

    .hero p {
      color: #65584e;
      max-width: 760px;
      margin: auto;
      line-height: 1.8;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      padding-bottom: 80px;
    }

    .product-card {
      background: white;
      border-radius: 34px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: 0.35s ease;
    }

    .product-card:hover {
      transform: translateY(-10px);
    }

    .product-card img {
      width: 100%;
      height: 340px;
      object-fit: contain;
      background: white;
      padding: 18px;
    }

    .product-info {
      padding: 28px;
    }

    .product-info h3 {
      font-size: 28px;
      margin-bottom: 12px;
      color: var(--wood);
    }

    .product-info p {
      color: #65584e;
      line-height: 1.8;
    }

    .back-btn {
      display: inline-block;
      margin-top: 24px;
      background: var(--wood);
      color: white;
      padding: 14px 24px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
    }

    @media(max-width: 900px) {
      .product-grid {
        grid-template-columns: repeat(2,1fr);
      }
    }

    @media(max-width: 640px) {
      .product-grid {
        grid-template-columns: 1fr;
      }

      .hero h2 {
        font-size: 42px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="brand">
        <div class="logo-box">
          <img src="logo.jpeg" alt="Logo">
        </div>

        <div>
          <h1>Banyuwangi Furniture</h1>
          <span>PREMIUM LIVING</span>
        </div>
      </a>
    </div>
  </nav>

  <section class="hero">
    <div class="container">
      <h2 id="judulProduk">Produk Furniture</h2>
      <p id="deskripsiProduk">Koleksi furniture premium Banyuwangi Furniture.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="product-grid" id="productContainer"></div>
    </div>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const kategori = params.get('kategori');

    const productData = {
      "ruang-makan": {
        title: "Furniture Ruang Makan",
        desc: "Koleksi furniture ruang makan premium dengan desain modern dan elegan.",
        items: [
          {
            name: "Kit Corner",
            image: "produk.jpeg",
            desc: "Kitchen set premium dengan desain minimalis modern dan material kayu natural berkualitas tinggi."
          }
        ]
      },

      "ruang-tamu": {
        title: "Furniture Ruang Tamu",
        desc: "Furniture ruang tamu modern dan premium.",
        items: [
          {
            name: "Sofa Premium",
            image: "https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=900&auto=format&fit=crop",
            desc: "Sofa modern dengan material premium dan kenyamanan maksimal."
          }
        ]
      },

      "kamar-tidur": {
        title: "Furniture Kamar Tidur",
        desc: "Koleksi kamar tidur modern dan nyaman.",
        items: [
          {
            name: "Bed Minimalis",
            image: "https://images.unsplash.com/photo-1616486029423-aaa4789e8c9a?q=80&w=900&auto=format&fit=crop",
            desc: "Tempat tidur premium dengan desain elegan dan modern."
          }
        ]
      },

      "kantor": {
        title: "Furniture Kantor",
        desc: "Furniture kantor profesional dan modern.",
        items: [
          {
            name: "Meja Kantor Premium",
            image: "https://images.unsplash.com/photo-1497366754035-f200968a6e72?q=80&w=900&auto=format&fit=crop",
            desc: "Meja kerja modern untuk ruang kantor produktif."
          }
        ]
      },

      "custom": {
        title: "Custom Furniture",
        desc: "Furniture custom sesuai kebutuhan dan desain ruang.",
        items: [
          {
            name: "Custom Interior",
            image: "https://images.unsplash.com/photo-1600566753151-384129cf4e3e?q=80&w=900&auto=format&fit=crop",
            desc: "Furniture custom sesuai ukuran dan konsep interior pelanggan."
          }
        ]
      }
    };

    const data = productData[kategori] || productData["ruang-makan"];

    document.getElementById('judulProduk').innerText = data.title;
    document.getElementById('deskripsiProduk').innerText = data.desc;

    document.getElementById('productContainer').innerHTML = data.items.map(item => `
      <div class="product-card">
        <img src="${item.image}" alt="${item.name}">

        <div class="product-info">
          <h3>${item.name}</h3>
          <p>${item.desc}</p>

          <a href="index.html#products" class="back-btn">
            ← Kembali
          </a>
        </div>
      </div>
    `).join('');
  </script>

</body>
</html>
